<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0a0f0d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050807" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#050807"/>
  <!-- perspective grid -->
  <g stroke="url(#grid)" stroke-width="1">
    <line x1="800" y1="470" x2="-300" y2="900"/>
    <line x1="800" y1="470" x2="-100" y2="900"/>
    <line x1="800" y1="470" x2="100" y2="900"/>
    <line x1="800" y1="470" x2="300" y2="900"/>
    <line x1="800" y1="470" x2="500" y2="900"/>
    <line x1="800" y1="470" x2="700" y2="900"/>
    <line x1="800" y1="470" x2="900" y2="900"/>
    <line x1="800" y1="470" x2="1100" y2="900"/>
    <line x1="800" y1="470" x2="1300" y2="900"/>
    <line x1="800" y1="470" x2="1500" y2="900"/>
    <line x1="800" y1="470" x2="1700" y2="900"/>
    <line x1="800" y1="470" x2="1900" y2="900"/>
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="770" x2="1600" y2="770"/>
    <line x1="0" y1="895" x2="1600" y2="895"/>
  </g>
  <!-- random matrix digits -->
  <g font-family="Courier New" font-size="20" fill="#00ff88" fill-opacity="0.5">
    <text x="120"  y="180">01001110</text>
    <text x="960"  y="120">00110101</text>
    <text x="1280" y="300">11000110</text>
    <text x="140"  y="420">10101101</text>
    <text x="1450" y="180">01110011</text>
    <text x="600"  y="80">01000010</text>
    <text x="330"  y="520">10110010</text>
  </g>
  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>